# ============================================================
# bootstrap-local.yml —— local Profile 的 bootstrap 覆盖
# 在 bootstrap 阶段关闭 Apollo/Consul，确保本地不尝试连接任何注册/配置中心。
# ============================================================
apollo:
  bootstrap:
    enabled: false
    eagerLoad:
      enabled: false

spring:
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
        register: false
