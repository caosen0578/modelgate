<div class="diagram-wrap">
<div class="diagram-title">② 应用架构图</div>
<svg width="1000" height="740" viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
  </marker>
  <marker id="arr2r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">

  </marker>
  <marker id="arr2g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">

  </marker>
  <filter id="sh2" x="-5%" y="-5%" width="110%" height="110%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/>
  </filter>
</defs>

<!-- ===== 请求入口 ===== -->
<rect x="340" y="10" width="320" height="44" rx="10" fill="#1e1b4b" filter="url(#sh2)"/>
<text x="500" y="30" font-size="12" fill="#a5b4fc" font-weight="600" text-anchor="middle">POST /v1/chat/completions</text>
<text x="500" y="46" font-size="10" fill="#6366f1" text-anchor="middle">Authorization: Bearer {api_key} | AKSK {ak}:{ts}:{sig}</text>

<!-- 主箭头向下 -->
<line x1="500" y1="55" x2="500" y2="72" stroke="#6366f1" stroke-width="2" marker-end="url(#arr2)"/>

<!-- ===== Filter 链 ===== -->
<!-- 标题背景 -->
<rect x="200" y="74" width="600" height="500" rx="14" fill="#f8faff" stroke="#c7d2fe" stroke-width="1.5"/>
<text x="500" y="96" font-size="12" fill="#4338ca" font-weight="700" text-anchor="middle">GlobalFilter 过滤器链（Spring Cloud Gateway · WebFlux · Reactor Netty）</text>

<!-- F1: AdminAuthFilter -->
<rect x="220" y="106" width="560" height="48" rx="9" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh2)"/>
<text x="280" y="127" font-size="10" fill="#991b1b" font-weight="700">order=-200</text>
<text x="360" y="127" font-size="12" fill="#1f2937" font-weight="700">AdminAuthFilter</text>
<text x="360" y="143" font-size="10" fill="#64748b">保护 /admin/** 和 /actuator/**，IP白名单 + X-Admin-Token 三层鉴权</text>
<text x="735" y="130" font-size="10" fill="#991b1b" text-anchor="end">→ 401/403</text>

<line x1="500" y1="155" x2="500" y2="170" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>

<!-- F2: CredentialAuthFilter -->
<rect x="220" y="172" width="560" height="48" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh2)"/>
<text x="280" y="193" font-size="10" fill="#92400e" font-weight="700">order=-190</text>
<text x="360" y="193" font-size="12" fill="#1f2937" font-weight="700">CredentialAuthFilter</text>
<text x="360" y="209" font-size="10" fill="#64748b">API Key→SHA256→Caffeine→Redis→DB；AK/SK→HMAC重签→时间戳防重放(±5min)</text>
<text x="735" y="196" font-size="10" fill="#92400e" text-anchor="end">→ 401</text>

<line x1="500" y1="221" x2="500" y2="236" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>

<!-- F3: AppAccessControlFilter -->
<rect x="220" y="238" width="560" height="48" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#sh2)"/>
<text x="280" y="259" font-size="10" fill="#78350f" font-weight="700">order=-180</text>
<text x="360" y="259" font-size="12" fill="#1f2937" font-weight="700">AppAccessControlFilter</text>
<text x="360" y="275" font-size="10" fill="#64748b">加载访问规则（Caffeine），校验客户端IP是否在CIDR/IP白名单，规则为空则放行</text>
<text x="735" y="262" font-size="10" fill="#78350f" text-anchor="end">→ 403</text>

<line x1="500" y1="287" x2="500" y2="302" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>

<!-- F4: ModelAuthFilter -->
<rect x="220" y="304" width="560" height="48" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh2)"/>
<text x="280" y="325" font-size="10" fill="#14532d" font-weight="700">order=-170</text>
<text x="360" y="325" font-size="12" fill="#1f2937" font-weight="700">ModelAuthFilter</text>
<text x="360" y="341" font-size="10" fill="#64748b">解析请求体 model 字段，查询mg_app_model_auth（Caffeine），校验授权开关/到期/模型状态</text>
<text x="735" y="328" font-size="10" fill="#14532d" text-anchor="end">→ 403/503</text>

<line x1="500" y1="353" x2="500" y2="368" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>

<!-- F5: RateLimitFilter -->
<rect x="220" y="370" width="560" height="48" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#sh2)"/>
<text x="280" y="391" font-size="10" fill="#1e3a8a" font-weight="700">order=-160</text>
<text x="360" y="391" font-size="12" fill="#1f2937" font-weight="700">RateLimitFilter</text>
<text x="360" y="407" font-size="10" fill="#64748b">Redis Lua 令牌桶（每秒滑动窗口），key=app_id，QPS 来自授权配置或全局默认</text>
<text x="735" y="394" font-size="10" fill="#1e3a8a" text-anchor="end">→ 429</text>

<line x1="500" y1="419" x2="500" y2="434" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr2)"/>

<!-- F6: TraceFilter -->
<rect x="220" y="436" width="560" height="48" rx="9" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" filter="url(#sh2)"/>
<text x="280" y="457" font-size="10" fill="#581c87" font-weight="700">order=-150</text>
