# ============================================================
# application.yml — 唯一配置文件，单一固定文档，不使用 Spring Profile 机制。
# DataSource（ServiceConfiguration）与 Redis（RedisConfig）均只有一套 Bean，直连数据库/Redis，
# 不再有内网中间件（Venus/内网 Redis 集群 SDK）分支。部署到不同环境需要不同参数（数据库地址、
# 密钥等）时，直接改这份文件里对应的值即可。
# ============================================================
server:
  port: 10811
  # 优雅停机：收到 SIGTERM 后先停止接收新连接，等在途请求处理完再关闭。
  # 对本网关尤其重要——LLM 请求正常就要跑 30~180 秒，直接切断等于让调用方白等一场，
  # 而且上游可能已经产生了计费。配合 /actuator/detection/shutdown 的摘流量动作使用：
  # 平台先调该端点（流量检查转 503、平台摘流量），再发 SIGTERM，此时在途请求已所剩无几。
  shutdown: graceful

# ===== 数据源（Druid 直连，见 ServiceConfiguration）=====
datasource:
  local:
    url: jdbc:mysql://47.119.189.29:65522/cbdb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: no1knowS
    # Druid 连接池参数，生产环境按需直接改这几行，无需改代码重新编译（2026-08-18 压测优化后externalize）。
    # 当前值是压测后评估的生产值，见 11-变更记录.md §22.1/§23；Java 侧默认值与此处一致，这里删掉某一行
    # 不会导致该项失效，只是退回代码里写死的同一个值。
    # time-between-eviction-runs-millis / min-evictable-idle-time-millis / remove-abandoned(-timeout-millis)
    # 已按行内标准值对齐（2026-08-18 用户提供）：30000 / 1800000 / false（remove-abandoned 关闭，
    # 与 Druid 官方"不建议生产开启"的建议一致，见 §23 记录）。
    pool:
      init-size: 5
      min-idle: 10
      max-active: 100
      max-wait: 3000
      time-between-eviction-runs-millis: 30000
      min-evictable-idle-time-millis: 1800000
      remove-abandoned: false
      remove-abandoned-timeout-millis: 300000

spring:
  # ⚠️ 必须留在 application.yml，不能只写在 bootstrap.yml：
  #    spring-cloud-starter-bootstrap 已随 Apollo/Consul 一并移除，Spring Cloud 2020+ 起
  #    没有这个依赖就**根本不读 bootstrap.yml**（该文件目前整体是死配置）。
  #    此处的值供 logback 的 APP_NAME（日志文件名与 JSON 字段 app）与启动提示使用。
  application:
    name: modelgate
  lifecycle:
    # 优雅停机的等待上限。取 30s 而不是更长：这段时间是"平台已经发了 SIGTERM 之后"的等待，
    # 正常情况下平台先调 /actuator/detection/shutdown 摘流量，到这一步在途请求已经很少。
    # 设得太长会拖慢每次发版，太短则会切断在途的长请求，30s 是两者的折中。
    # 注意这与 AuditService/PayloadService 的 15s 刷盘时限是两回事，后者在此之内完成。
    timeout-per-shutdown-phase: 30s
  # ===== Spring Cloud Gateway 路由 =====
  # 超时策略：response-timeout 570s < SLB 600s，Gateway 先超时返回 504；SSE 场景开启 tcp-keepalive
  # F5 idle timeout 待运维确认，见 TODO：排查 F5 idle timeout
  #
  # 前缀说明：Spring Cloud Gateway 4.2 起，WebFlux 版配置迁移到
  #   spring.cloud.gateway.server.webflux.*（旧的 spring.cloud.gateway.* 仅作兼容别名保留）。
  #   本项目已随 Spring Cloud 2025.0.x 升级切换到新前缀。
  #   ⚠️ 若启动后 /v1/** 路由未加载（业务请求 404），说明该版本仍只认旧前缀，
  #      把 server.webflux 这一层去掉即可回退。
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: model-route
              uri: http://127.0.0.1:9090
              predicates:
                - Path=/v1/**
              filters:
                - PreserveHostHeader
                - name: RequestSize
                  args:
                    maxSize: 10MB
                # 上游暂时不可用（502/503）时重试 1 次，LLM 场景不对超时重试（避免重复计费/重复推理）
                - name: Retry
                  args:
                    retries: 1
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                    methods: POST
                    backoff:
                      firstBackoff: 1s
                      maxBackoff: 3s
          httpclient:
            response-timeout: 570s
            connect-timeout: 5000
            tcp-keepalive: true
            pool:
              type: FIXED
              # 按 400 用户峰值约 150 并发预留 2x 余量；扩容到 800 用户时改为 800
              max-connections: 500
              # 等待连接池分配超时：30s 内等不到连接直接报错，避免请求无限堆积
              acquire-timeout: 30000
              # 【闲置回收】连接空闲超过这么久就回收。只管"闲太久的"，管不到"一直在用的"
              max-idle-time: 120s
              # 【存活上限】不管忙不忙，连接活满这么久就退休、下次重新建。
              #   为什么必须有：max-idle-time 只回收空闲连接，而一条持续被复用的连接**永远不空闲**，
              #   于是永远不会被回收。上游滚动发布时旧实例已下线，网关手里那条老连接还"活着"
              #   （TCP 半开或连接指向已摘除的后端），请求继续往死实例上打 → 报错或超时，
              #   只能重启网关才恢复。配了它，连接池就能自然跟上上游拓扑变化。
              #   取 10m 而不是常见的 30m/60m：本项目上游是信创 NPU 部署的模型，单次请求
              #   动辄几十秒到几分钟，TLS 握手那 100~200ms 摊到这种请求上完全是噪声
              #   （占比不到 0.1%）——既然复用的收益可以忽略，就换成"更快跟上拓扑变化"。
              #   注意：只在连接**归还**或**借出**时判定，不会掐断正在进行中的请求。
              max-life-time: 10m
              # 【后台清理】默认只在"有人来借连接"的那一刻才顺带清理过期连接。
              #   低峰期没人借 → 一堆过期连接挂在池里占着 fd 和内存，直到下一个请求到来才被清掉，
              #   而那一波请求还要边清边建、平白多等。开了它就有后台任务定期扫，
              #   低峰不白占资源，高峰第一波也不用给前人擦屁股。
              #   ⚠️ 配置项名是 eviction-interval（对应 HttpClientProperties.Pool.evictionInterval），
              #      不是 evict-in-background，写错了不会报错、只是静默不生效。
              eviction-interval: 60s
              # 【借出策略】LIFO=优先复用最近归还的那条连接。
              #   默认 FIFO 会轮着用池里所有连接，导致一大批连接都"温着"但每条都不够热；
              #   LIFO 让少数连接反复被用（保持活跃），其余自然闲置到期被回收，
              #   等于让连接池规模自动贴合真实并发，而不是长期维持在历史峰值。
              leasing-strategy: lifo
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

# ===== MyBatis Plus =====
# ⚠️ 本项目在 TdsqlMybatisPlusConfig 中自定义了 SqlSessionFactory，
#    MybatisPlusAutoConfiguration 因此退避，**mybatis-plus.* 下只有被代码显式承接的项才生效**。
#    已移除的无效项：
#      · configuration.map-underscore-to-camel-case  → 代码里固定 true（项目强制约束，不允许配置改掉）
#      · global-config.db-config.id-type             → 由实体上的 @TableId(type = AUTO) 决定
#      · global-config.db-config.logic-delete-field  → 由实体上的 @TableLogic 决定
mybatis-plus:
  configuration:
    # 唯一生效项：由 TdsqlMybatisPlusConfig 通过 @Value 承接。
    # 排查 SQL 问题时改成 org.apache.ibatis.logging.stdout.StdOutImpl；日常保持静音（高频上报下避免日志噪声）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 【已移除】springdoc.* —— 内网仓库无 springdoc-openapi-starter-webflux-ui，
#   在线 Swagger UI 与 /v3/api-docs 均不再提供，接口契约以 spec/modelgate/04-接口与数据结构.md 为准。
#   Controller 上的 @Tag/@Operation/@Parameter 注解保留，仅作源码内说明。

# ===== Actuator =====
# 【已移除】prometheus 端点与 management.metrics.tags —— 本项目不接 Prometheus/Grafana，
#   micrometer-registry-prometheus 依赖已从 pom 删除，暴露该端点也只会 404。
#   保留 health：K8s liveness/readiness 探针依赖它（见 10 §3）。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ===== Resilience4j 熔断器 =====
# 熔断器保护上游 AI 服务：当失败率或慢调用率超过阈值时快速拒绝请求，
# 避免大量请求堆积打爆上游，待上游恢复后自动重新接入。
# 状态流转：CLOSED（正常）→ OPEN（熔断）→ HALF_OPEN（探测）→ CLOSED（恢复）
resilience4j:
  circuitbreaker:
    instances:
      modelUpstream:
        # 滑动窗口类型：COUNT_BASED=按请求次数统计（取最近 N 次）
        slidingWindowType: COUNT_BASED
        # 统计最近 20 次请求，窗口满后才计算失败率（避免冷启动时少量失败误触发）
        slidingWindowSize: 20
        # 失败率阈值：20 次里失败 ≥ 50% 触发熔断
        failureRateThreshold: 50
        # 慢调用率阈值：90% 以上慢调用才熔断
        # GLM-5 / DSv4 代码生成正常响应就需要 30~180s，必须放宽，否则会误熔断正常请求
        slowCallRateThreshold: 90
        # 慢调用判定时长：超过 180s 才算慢调用
        # 行业标准：设为 P95 响应时间的 1.5~2 倍，DSv4 思维链 P95 约 120s
        slowCallDurationThreshold: 180s
        # 熔断冷却时间：OPEN 状态持续 60s 后进入 HALF_OPEN 探测（LLM 恢复通常需要时间）
        waitDurationInOpenState: 60s
        # 半开探测请求数：放行 5 个探测请求，全部成功才恢复 CLOSED
        permittedNumberOfCallsInHalfOpenState: 5
        # 冷却到期后自动切换到 HALF_OPEN，无需等下一个请求触发
        automaticTransitionFromOpenToHalfOpenEnabled: true

# ===== ModelGate 自定义配置（Apollo 热更新以下所有项） =====
modelgate:
  # 【已移除】modelgate.upstream.url
  # 该属性此前仅作为 GatewayConfigService.getUpstreamUrl() 的兜底值，而该方法无任何路由调用方，
  # 已随 upstream.url 配置项一并删除。Gateway 静态路由的占位地址见上方
  # spring.cloud.gateway.routes[model-route].uri（${MODEL_UPSTREAM_URL}），那个仍然需要保留：
  # Gateway 要求路由定义必须有 uri，实际转发目标由 ModelRouteFilter 按 mg_model.upstream_url 逐请求覆盖。

  # API Key 白名单两级缓存配置
  # 【已移除】modelgate.whitelist.* 四项 —— 全项目无任何读取方。
  # 旧 whitelist 表早已随兼容表一并删除，来源白名单现由 mg_access_rule + AppAccessControlFilter 承担，
  # 缓存参数写死在 GatewayCacheManager（accessRuleCache，L1 60s）。

  # 【已移除】modelgate.admin.*（Token 列表 / IP 白名单 / Basic Auth）
  # AdminAuthFilter 已删除，管理面 /modelgate/** 改由内网逐接口鉴权体系承担，
  # 本进程不再对管理接口做任何身份校验。详见 spec/modelgate/05-边界限制与禁止规则.md。

  # 审计日志：每次 API 调用写一条记录，enabled/db-write 可独立开关用于故障时降级
  # enabled=false：完全关闭审计
  # db-write=false：跳过 DB 写入（DB 故障时降级，月度 Token 累计仍正常）
  audit:
    enabled: true                  # 是否开启审计日志
    db-write: true                 # 是否写入 MySQL audit_log 表
    buffer-size: 200000            # 内存队列最大条数，满时丢弃并打 WARN
    flush-interval-ms: 2000        # 批量写入间隔（毫秒），每次最多写 5000 条
    retention-days: 90             # 日志保留天数，超期由 AuditCleanupService 删除
    cleanup-cron: "0 0 2 * * ?"   # 清理任务 cron，默认每天凌晨 2 点

  # ===== 请求/响应报文留档 =====
  # 记录哪些请求由「接入系统 → 模型授权」页上的开关逐条控制（mg_app_model_auth.payload_log_enabled）；
  # 此处是全局参数与总开关。报文只写 mg_request_payload，Token 统计始终走 mg_audit_log 不受影响。
  # ===== 容器平台探测端点 =====
  # 路径由行内容器平台约定：/actuator/detection/{running,available,shutdown}，不可更改。
  detection:
    # 流量检查是否恒返回 200。
    #   true （默认，保守值）：恒 200，真实状态只体现在响应体（available/starting/draining）。
    #       取这个值是因为**尚未确认平台对"流量检查失败"的处理方式**：标准语义是把实例摘出
    #       负载均衡，但有的平台会当成不健康直接重启容器——那会在优雅退出或启动稍慢时
    #       重启容器，反而制造出我们正要解决的那个问题。
    #   false：恢复标准语义，未就绪/退出中返回 503，平台据此自动停止派发新流量。
    # 确认平台"流量检查失败只摘流量、不重启"之后，改成 false 更好——
    # 恒 200 的代价是优雅退出期间平台不会主动停发新流量，只能靠平台自己的摘流量流程。
    available-always-200: true

  payload-log:
    enabled: true                  # 全局总开关。授权级开关控制"记哪些"，本开关是磁盘告警时的一键止血手段
    buffer-size: 20000             # 内存队列条数。报文体积远大于审计记录，取审计的 1/10 控制堆占用；满时丢弃并打 WARN（绝不阻塞业务）
    batch-size: 200                # 单批落库条数。报文含 LONGTEXT，批次过大会撑爆 max_allowed_packet
    flush-interval-ms: 2000        # 消费端刷盘间隔（毫秒）；SSE 拼接与 JSON 解析都在这个线程做，与业务链路隔离
    retention-days: 7              # 保留天数。刻意远短于审计的 90 天——报文单行体积是审计的几十到上千倍
    cleanup-cron: "0 30 2 * * ?"  # 清理 cron，错开审计清理（2:00）避免同时抢 IO
    # 内存保护阈值（字节，默认 64MB）。按决策不限制存储大小，但内存缓冲必须有保险丝：
    # 上游异常吐出超大响应时若无上限会吃光堆内存触发 OOM，那是全部请求一起挂。
    # 达到阈值只停止本条采集并标记 truncated，转发完全不受影响。设为 0 表示不设防（不建议）。
    max-capture-bytes: 67108864

  # 模型凭证加密密钥：用于加密存储在 MySQL 中的 AK/SK 等敏感凭证
  # 必须为 32 字节 base64 编码字符串（生成方法见 10-部署与运维手册 §2.1）；为空时加密功能不可用。
  # 单一固定值，不走环境变量：部署到哪个环境，直接把这一行改成那个环境的真实密钥即可。
  # ⚠️ 下面这把是本地联调测试密钥，仅用于解密本地联调库里的既有数据，不是生产密钥。
  crypto:
    key: bW9kZWxnYXRlLWxvY2FsLWRldi1hZXMyNTYta2V5ISE=

  # 默认限流配置（每个 appId 的兜底 QPS，单独授权的 appId+modelId 可在 mg_app_model_auth 表覆盖此值）
  # codebuddy 场景：用户操作间隔长（编码思考约 3~5 分钟），单用户连续触发 QPS 不高
  rate-limit:
    default-rate: 5    # 每秒最大请求数（滑动窗口，Redis Lua 原子执行）
    # 【已移除】default-burst —— RateLimitService 用的是滑动窗口，算法里根本没有"突发容量"这个概念，
    # 该配置从未被读取；留着会让人以为调它能放宽瞬时并发。

# ===== Redis（jedis 直连，见 RedisConfig）=====
redis:
  local:
    host: 127.0.0.1
    port: 6379
    password: admin123456
    # Jedis 连接池参数，生产环境按需直接改这几行（2026-08-18 压测优化后 externalize）。
    # 当前值是压测后评估的生产值，见 11-变更记录.md §22.4；Java 侧默认值与此处一致。
    pool:
      max-total: 100
      max-idle: 32
      min-idle: 10
      max-wait-millis: 3000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
