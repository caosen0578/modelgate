# ============================================================
# application.yml — 本地 fallback 默认值
# 生产环境所有配置通过 Apollo 下发，此处仅作本地开发兜底
# ============================================================
server:
  port: 8080

# ===== 数据源（Venus/Druid，配置由 Apollo tdsql_datasource_config 命名空间下发）=====
datasource:
  namespace: tdsql_datasource_config

spring:
  # ===== Kafka =====
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
    consumer:
      group-id: modelgate-audit
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # ===== MyBatis Plus =====
  # datasource 已配置，mybatis-plus 自动使用上方 datasource

# ===== MyBatis Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: null

  # ===== Spring Cloud Gateway 路由 =====
  cloud:
    gateway:
      # 上游模型服务地址 — 生产从 Apollo 注入
      routes:
        - id: model-route
          uri: ${MODEL_UPSTREAM_URL:http://127.0.0.1:9090}
          predicates:
            - Path=/v1/**
          filters:
            - PreserveHostHeader
            - name: RequestSize
              args:
                maxSize: 10MB
            # 上游暂时不可用（502/503）时重试 1 次，LLM 场景不对超时重试（避免重复计费/重复推理）
            - name: Retry
              args:
                retries: 1
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: POST
                backoff:
                  firstBackoff: 1s
                  maxBackoff: 3s
      # ---------------------------------------------------------------
      # 超时策略（与用户侧 SLB 600s 对齐，行业标准：Gateway < SLB < F5）
      # response-timeout：570s，比 SLB 少 30s，确保 Gateway 先超时并向客户端
      #   返回可读的 504 错误，而不是被 SLB 直接 502 截断
      # connect-timeout：5s，上游建连超时，过长会阻塞请求队列
      # tcp-keepalive：SSE 流式场景必须开启，防止 F5/SLB 因 idle timeout
      #   切断思维链推理阶段（首 token 前）的"无数据"长连接
      #   （F5 idle timeout 待运维确认，见 TODO：排查 F5 idle timeout）
      # ---------------------------------------------------------------
      httpclient:
        response-timeout: 570s
        connect-timeout: 5000
        tcp-keepalive: true
        pool:
          type: FIXED
          # 按 400 用户峰值约 150 并发预留 2x 余量；扩容到 800 用户时改为 800
          max-connections: 500
          # 等待连接池分配超时：30s 内等不到连接直接报错，避免请求无限堆积
          acquire-timeout: 30000
          max-idle-time: 120s
      # 允许获取真实 Body（限流 key resolver 需要）
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

# ===== Actuator =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ===== Resilience4j 熔断器 =====
# 熔断器保护上游 AI 服务：当失败率或慢调用率超过阈值时快速拒绝请求，
# 避免大量请求堆积打爆上游，待上游恢复后自动重新接入。
# 状态流转：CLOSED（正常）→ OPEN（熔断）→ HALF_OPEN（探测）→ CLOSED（恢复）
resilience4j:
  circuitbreaker:
    instances:
      modelUpstream:
        # 滑动窗口类型：COUNT_BASED=按请求次数统计（取最近 N 次）
        slidingWindowType: COUNT_BASED
        # 统计最近 20 次请求，窗口满后才计算失败率（避免冷启动时少量失败误触发）
        slidingWindowSize: 20
        # 失败率阈值：20 次里失败 ≥ 50% 触发熔断
        failureRateThreshold: 50
        # 慢调用率阈值：90% 以上慢调用才熔断
        # GLM-5 / DSv4 代码生成正常响应就需要 30~180s，必须放宽，否则会误熔断正常请求
        slowCallRateThreshold: 90
        # 慢调用判定时长：超过 180s 才算慢调用
        # 行业标准：设为 P95 响应时间的 1.5~2 倍，DSv4 思维链 P95 约 120s
        slowCallDurationThreshold: 180s
        # 熔断冷却时间：OPEN 状态持续 60s 后进入 HALF_OPEN 探测（LLM 恢复通常需要时间）
        waitDurationInOpenState: 60s
        # 半开探测请求数：放行 5 个探测请求，全部成功才恢复 CLOSED
        permittedNumberOfCallsInHalfOpenState: 5
        # 冷却到期后自动切换到 HALF_OPEN，无需等下一个请求触发
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      modelUpstream:
        # 与 httpclient.response-timeout 对齐，570s 兜底防请求永久挂死
        timeoutDuration: 570s

# ===== ModelGate 自定义配置（Apollo 热更新以下所有项） =====
modelgate:
  # Gateway 静态路由占位地址，实际转发目标由 ModelRouteFilter 按 model_instance.upstream_url 动态覆盖
  # 真实路由：请求 → ModelRouteFilter 读 body 的 model 字段 → 查 DB/缓存得到 ModelInstance.upstreamUrl → 覆盖转发地址
  # 此处地址仅供 Gateway 启动时初始化静态路由使用，生产流量不会打到这里
  upstream:
    url: ${MODEL_UPSTREAM_URL:http://127.0.0.1:9090}

  # API Key 白名单两级缓存配置
  # 缓存链路：请求 → Caffeine L1（本进程内，TTL 60s）→ Redis L2 → MySQL
  # 定时任务每 sync-interval-seconds 秒将 MySQL 最新白名单全量同步到 Redis，保证多实例数据一致
  whitelist:
    # Caffeine 本地缓存过期时间（秒）：60s 内命中直接返回，无需访问 Redis
    local-cache-ttl: 60
    # Caffeine 本地缓存最大条目数：超出后按 LRU 淘汰
    local-cache-max-size: 10000
    # Redis key 前缀，完整 key 格式：wl:apikey:{apiKey}
    redis-key-prefix: "wl:apikey:"
    # MySQL → Redis 全量同步间隔（秒）：保证新增/删除的白名单在 5 分钟内同步到所有实例
    sync-interval-seconds: 300

  # /admin/** 管理接口双重鉴权：Token 校验 + IP 白名单
  # 生产环境 token 和密码必须通过 Apollo 或环境变量替换，禁止使用默认值
  admin:
    # Admin Token 列表，请求 Header 携带 X-Admin-Token，匹配任一 token 即通过
    tokens:
      - name: ops-team
        token: ${ADMIN_TOKEN_OPS:mg-admin-change-me-in-prod}
    # 来源 IP 白名单，支持精确 IP 和 CIDR 段；列表为空则跳过 IP 校验
    allowed-ips:
      - 127.0.0.1        # 本机
      - 10.0.0.0/8       # 内网 A 类
      - 172.16.0.0/12    # 内网 B 类
      - 192.168.0.0/16   # 内网 C 类
    # Basic Auth：可选，用于浏览器直接访问管理页面时弹出认证框
    basic-auth:
      enabled: true
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:changeme}

  # 审计日志：每次 API 调用写一条记录，enabled/db-write 可独立开关用于故障时降级
  # enabled=false：完全关闭审计（Kafka + DB 均不写）
  # db-write=false：只发 Kafka，跳过 DB 写入（DB 故障时降级用）
  audit:
    topic: modelgate-audit-log     # Kafka topic 名称
    enabled: true                  # 是否开启审计日志
    db-write: true                 # 是否同时写入 MySQL audit_log 表
    buffer-size: 200000            # 内存队列最大条数，满时丢弃并打 WARN
    flush-interval-ms: 2000        # 批量写入间隔（毫秒），每次最多写 5000 条
    retention-days: 90             # 日志保留天数，超期由 AuditCleanupService 删除
    cleanup-cron: "0 0 2 * * ?"   # 清理任务 cron，默认每天凌晨 2 点

  # 模型凭证加密密钥：用于加密存储在 MySQL 中的 AK/SK 等敏感凭证
  # 必须为 32 字节 base64 编码字符串；生产环境通过环境变量注入，本地开发需手动设置，为空时加密功能不可用
  crypto:
    key: ${MODELGATE_CRYPTO_KEY:}

  # 默认限流配置（每个 appId 的兜底 QPS，单独授权的 appId+modelId 可在 mg_app_model_auth 表覆盖此值）
  # codebuddy 场景：用户操作间隔长（编码思考约 3~5 分钟），单用户连续触发 QPS 不高
  rate-limit:
    default-rate: 5    # 每秒最大请求数（滑动窗口，Redis Lua 原子执行）
    default-burst: 10  # 突发容量：短时连续触发（如粘贴大段代码）最多放行 10 个
